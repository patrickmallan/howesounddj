<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="rough" x="-8%" y="-12%" width="116%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.08" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <filter id="metal" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#050608" flood-opacity=".8"/>
    </filter>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343940"/>
      <stop offset=".45" stop-color="#111418"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#51565d"/>
      <stop offset=".18" stop-color="#d9d5ca"/>
      <stop offset=".42" stop-color="#777c83"/>
      <stop offset=".66" stop-color="#f4eddf"/>
      <stop offset="1" stop-color="#383d43"/>
    </linearGradient>
    <radialGradient id="knobFace" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#565d65"/>
      <stop offset=".35" stop-color="#20242a"/>
      <stop offset="1" stop-color="#07080a"/>
    </radialGradient>
    <pattern id="halftone" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#101114" opacity=".25"/>
    </pattern>
    <g id="knob">
      <circle r="79" fill="#0754ff" transform="translate(-7 6)" opacity=".9"/>
      <circle r="79" fill="#ff4f55" transform="translate(8 8)" opacity=".9"/>
      <path d="M0-79 19-75 38-69 53-57 67-42 74-22 79 0 74 22 67 42 53 57 38 69 19 75 0 79-19 75-38 69-53 57-67 42-74 22-79 0-74-22-67-42-53-57-38-69-19-75Z" fill="#f3ecdf" stroke="#0a0b0d" stroke-width="13"/>
      <circle r="63" fill="url(#knobFace)" stroke="#9ca1a6" stroke-width="5"/>
      <circle r="51" fill="none" stroke="#040506" stroke-width="7"/>
      <path d="M0-52V-10" stroke="#f3ecdf" stroke-width="11" stroke-linecap="round"/>
      <path d="M-38-38A54 54 0 0 1 38-38" fill="none" stroke="#fff" stroke-width="4" opacity=".35"/>
      <g stroke="#0a0b0d" stroke-width="4">
        <path d="M-57-58l-10-10M57-58l10-10M-79 0h-14M79 0h14M-57 58l-10 10M57 58l10 10"/>
      </g>
    </g>
  </defs>

  <!-- A slab-serif record-poster wordmark with deliberate print misregistration. -->
  <g filter="url(#rough)" aria-label="Howe Sound">
    <g font-family="Rockwell, Charter, Georgia, serif" font-size="174" font-weight="900" letter-spacing="-7" stroke="#0b0c0f" stroke-width="16" paint-order="stroke">
      <g fill="#0754ff" transform="translate(-8 -4)"><text x="70" y="182">H</text><text x="371" y="182">WE</text><text x="830" y="182">S</text><text x="1131" y="182">UND</text></g>
      <g fill="#ff4f55" transform="translate(8 8)"><text x="70" y="182">H</text><text x="371" y="182">WE</text><text x="830" y="182">S</text><text x="1131" y="182">UND</text></g>
      <g fill="#f3ecdf"><text x="70" y="182">H</text><text x="371" y="182">WE</text><text x="830" y="182">S</text><text x="1131" y="182">UND</text></g>
    </g>
    <use href="#knob" transform="translate(280 118)"/>
    <use href="#knob" transform="translate(1040 118)"/>
    <rect x="57" y="37" width="1482" height="157" fill="url(#halftone)" opacity=".45"/>
  </g>

  <!-- Wedding DJ becomes a screen-printed tape mark rather than a yellow subtitle. -->
  <g transform="translate(570 205) rotate(-1 230 37)" filter="url(#rough)">
    <path d="M0 12 440 0 462 61 15 75Z" fill="#0754ff" transform="translate(-8 8)"/>
    <path d="M0 5 445 0 460 62 9 72Z" fill="#ff4f55"/>
    <text x="228" y="54" text-anchor="middle" fill="#f3ecdf" font-family="Avenir Next Condensed, DIN Condensed, Impact, sans-serif" font-size="54" font-weight="900" letter-spacing="12">WEDDING DJ</text>
  </g>

  <!-- Detailed horizontal crossfader with a mechanically correct vertical cap. -->
  <g transform="translate(238 285)" filter="url(#metal)">
    <path d="M14 13 1120 0 1110 115 0 128Z" fill="#0754ff" opacity=".9"/>
    <path d="M0 4 1110 11 1120 115 8 120Z" fill="#ff4f55" opacity=".9"/>
    <path d="M11 0 1110 6 1100 108 0 116Z" fill="url(#plate)" stroke="#f3ecdf" stroke-width="7"/>
    <path d="M63 57H1042" stroke="#686e76" stroke-width="16" stroke-linecap="round"/>
    <path d="M63 57H1042" stroke="#090a0c" stroke-width="7" stroke-linecap="round"/>
    <g stroke="#b7b9b7" stroke-width="4" opacity=".8">
      <path d="M92 22v18M157 22v18M222 22v18M287 22v18M352 22v18M417 22v18M482 22v18M547 22v18M612 22v18M677 22v18M742 22v18M807 22v18M872 22v18M937 22v18M1002 22v18"/>
    </g>
    <g fill="#ff4f55"><circle cx="103" cy="88" r="6"/><circle cx="126" cy="88" r="6"/><circle cx="149" cy="88" r="6"/></g>
    <g fill="#23e7d8"><circle cx="951" cy="88" r="6"/><circle cx="974" cy="88" r="6"/><circle cx="997" cy="88" r="6"/></g>
    <text x="25" y="92" fill="#f3ecdf" font-family="Geist Mono, monospace" font-size="21" font-weight="800" letter-spacing="3">A</text>
    <text x="1059" y="92" fill="#f3ecdf" font-family="Geist Mono, monospace" font-size="21" font-weight="800" letter-spacing="3">B</text>
    <text x="550" y="94" text-anchor="middle" fill="#888e95" font-family="Geist Mono, monospace" font-size="13" font-weight="700" letter-spacing="4">HOWE / SOUND</text>
    <g transform="translate(509 2)">
      <path d="M8 8 22 0H79L93 9 87 108 72 116H17L2 106Z" fill="#08090b" stroke="#030405" stroke-width="8"/>
      <path d="M14 13 25 6H74L84 13 80 101 68 108H23L11 100Z" fill="url(#cap)" stroke="#d8d4c9" stroke-width="4"/>
      <path d="M26 18v77M39 13v88M52 12v90M65 14v85" stroke="#363a40" stroke-width="7"/>
      <path d="M20 20H77" stroke="#fff" stroke-width="4" opacity=".55"/>
      <circle cx="47" cy="58" r="8" fill="#ff4f55" stroke="#111" stroke-width="3"/>
    </g>
    <g fill="#c9c5ba" stroke="#060709" stroke-width="3">
      <circle cx="27" cy="23" r="9"/><circle cx="1080" cy="26" r="9"/><circle cx="31" cy="95" r="9"/><circle cx="1075" cy="91" r="9"/>
    </g>
  </g>
</svg>
