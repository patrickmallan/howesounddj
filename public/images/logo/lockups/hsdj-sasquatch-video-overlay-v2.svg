<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Howe Sound Wedding DJ translucent video-overlay logo</title>
  <desc id="desc">A raised-arm Sasquatch DJ behind a Howe Sound wordmark with aligned EQ knob letters and a crossfader underline.</desc>
  <defs>
    <filter id="keyline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="expanded"/>
      <feFlood flood-color="#f4eddf" result="colour"/>
      <feComposite in="colour" in2="expanded" operator="in" result="line"/>
      <feMerge><feMergeNode in="line"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="knob">
      <path d="M0,-74 L13,-70 L26,-69 L38,-61 L51,-54 L57,-41 L68,-30 L69,-16 L74,0 L69,16 L68,30 L57,41 L51,54 L38,61 L26,69 L13,70 L0,74 L-13,70 L-26,69 L-38,61 L-51,54 L-57,41 L-68,30 L-69,16 L-74,0 L-69,-16 L-68,-30 L-57,-41 L-51,-54 L-38,-61 L-26,-69 L-13,-70 Z" fill="#f4eddf" stroke="#101011" stroke-width="14"/>
      <circle r="59" fill="#111214" stroke="#6c6e72" stroke-width="5"/>
      <path d="M0,-49 V-10" stroke="#f4eddf" stroke-width="10" stroke-linecap="round"/>
      <path d="M-38,-43 A58,58 0 0 1 38,-43" fill="none" stroke="#aaa" stroke-width="5" opacity=".65"/>
      <circle r="8" fill="#050506"/>
    </g>
  </defs>

  <!-- The character fills the vertical field; translucency is controlled by the site so the identity stays reusable elsewhere. -->
  <image xlink:href="../characters/hsdj-sasquatch-patrick-pose-v1-transparent.png" x="540" y="0" width="520" height="902" preserveAspectRatio="xMidYMin meet" filter="url(#keyline)"/>

  <!-- Clear O-sized spaces prevent either knob from colliding with adjacent letters. -->
  <g aria-label="Howe Sound">
    <g transform="translate(11 11)" fill="#ff2838" stroke="#101011" stroke-width="20" paint-order="stroke">
      <text x="40" y="630" font-family="Arial Black, Impact, sans-serif" font-size="190" font-weight="900" letter-spacing="-9">H</text>
      <text x="365" y="630" font-family="Arial Black, Impact, sans-serif" font-size="190" font-weight="900" letter-spacing="-9">WE</text>
      <text x="760" y="630" font-family="Arial Black, Impact, sans-serif" font-size="190" font-weight="900" letter-spacing="-9">S</text>
      <text x="1085" y="630" font-family="Arial Black, Impact, sans-serif" font-size="190" font-weight="900" letter-spacing="-9">UND</text>
    </g>
    <g transform="translate(-9 -6)" fill="#0754ff" stroke="#101011" stroke-width="20" paint-order="stroke">
      <text x="40" y="630" font-family="Arial Black, Impact, sans-serif" font-size="190" font-weight="900" letter-spacing="-9">H</text>
      <text x="365" y="630" font-family="Arial Black, Impact, sans-serif" font-size="190" font-weight="900" letter-spacing="-9">WE</text>
      <text x="760" y="630" font-family="Arial Black, Impact, sans-serif" font-size="190" font-weight="900" letter-spacing="-9">S</text>
      <text x="1085" y="630" font-family="Arial Black, Impact, sans-serif" font-size="190" font-weight="900" letter-spacing="-9">UND</text>
    </g>
    <g fill="#f4eddf" stroke="#101011" stroke-width="20" paint-order="stroke">
      <text x="40" y="630" font-family="Arial Black, Impact, sans-serif" font-size="190" font-weight="900" letter-spacing="-9">H</text>
      <text x="365" y="630" font-family="Arial Black, Impact, sans-serif" font-size="190" font-weight="900" letter-spacing="-9">WE</text>
      <text x="760" y="630" font-family="Arial Black, Impact, sans-serif" font-size="190" font-weight="900" letter-spacing="-9">S</text>
      <text x="1085" y="630" font-family="Arial Black, Impact, sans-serif" font-size="190" font-weight="900" letter-spacing="-9">UND</text>
    </g>
    <use xlink:href="#knob" transform="translate(270 560)"/>
    <use xlink:href="#knob" transform="translate(990 560)"/>
  </g>

  <!-- Crossfader cap is vertical and centred in the gap between HOWE and SOUND. -->
  <g transform="translate(102 665)">
    <path d="M18,12 H1392 L1374,112 H0 Z" fill="#0754ff"/>
    <path d="M0,0 H1392 L1378,100 H14 Z" fill="#ff2838" transform="translate(10 8)"/>
    <path d="M8,0 H1388 L1372,97 H0 Z" fill="#101011" stroke="#f4eddf" stroke-width="8"/>
    <g stroke="#85878a" stroke-width="4">
      <path d="M72,16v21 M146,16v21 M220,16v21 M294,16v21 M368,16v21 M442,16v21 M516,16v21 M590,16v21 M664,16v21 M738,16v21 M812,16v21 M886,16v21 M960,16v21 M1034,16v21 M1108,16v21 M1182,16v21 M1256,16v21 M1330,16v21"/>
    </g>
    <rect x="68" y="55" width="1256" height="10" rx="5" fill="#050506" stroke="#7b7d80" stroke-width="3"/>
    <text x="31" y="84" fill="#f4eddf" font-family="Arial, sans-serif" font-size="25" font-weight="900">A</text>
    <text x="1338" y="84" fill="#f4eddf" font-family="Arial, sans-serif" font-size="25" font-weight="900">B</text>
    <g transform="translate(569 0)">
      <path d="M0,11 L14,0 H70 L84,11 V87 L70,98 H14 L0,87 Z" fill="#e4e5e7" stroke="#050506" stroke-width="8"/>
      <path d="M21,12v74 M35,8v82 M49,8v82 M63,12v74" stroke="#67696c" stroke-width="7"/>
      <path d="M13,17 H71" stroke="#fff" stroke-width="4" opacity=".75"/>
    </g>
  </g>

  <g text-anchor="middle">
    <text x="814" y="860" fill="#101011" stroke="#101011" stroke-width="25" paint-order="stroke" font-family="Arial Black, Impact, sans-serif" font-size="112" font-weight="900" letter-spacing="17">WEDDING DJ</text>
    <text x="800" y="847" fill="#ffe000" font-family="Arial Black, Impact, sans-serif" font-size="112" font-weight="900" letter-spacing="17">WEDDING DJ</text>
  </g>
</svg>
