  <text x="61" y="202" fill="#42d8e8" font-family="Arial" font-size="15" font-weight="800" letter-spacing="3">SATURDAY, SEPTEMBER 12, 2027</text>
  <text x="60" y="324" fill="#fbf4ea" font-family="Arial" font-size="80" font-weight="900" letter-spacing="-3" filter="url(#shadow)">THIS IS THE ANSWER</text>
  <text x="60" y="402" fill="#fbf4ea" font-family="Arial" font-size="80" font-weight="900" letter-spacing="-3" filter="url(#shadow)">YOU WERE HOPING FOR.</text>
  <text x="61" y="490" fill="#f5d71f" font-family="Arial" font-size="52" font-weight="900">YOUR DATE IS AVAILABLE.</text>
  <text x="65" y="546" fill="#f3eee7" font-family="Arial" font-size="21" font-weight="700">Book a 45-minute consult and tell me what you’re planning.</text>
  <text x="65" y="577" fill="#f3eee7" font-family="Arial" font-size="21" font-weight="700">We’ll talk about the wedding, the music, and whether I’m the right DJ for it.</text>
  <path d="M65 615C252 590 407 646 565 610S812 594 1019 620S1237 594 1382 610" fill="none" stroke="#42d8e8" stroke-width="4"/>
  <path d="M63 652H534L561 678L533 752H63Z" fill="#f5d71f"/>
  <text x="166" y="716" fill="#080b0b" font-family="Arial" font-size="27" font-weight="900">BOOK A CONSULT ↗</text>
  <text x="64" y="793" fill="#42d8e8" font-family="Arial" font-size="15" font-weight="800">NEED TO CHANGE THE DATE?</text>
  <text x="64" y="820" fill="#f3eee7" font-family="Arial" font-size="17">Check another one.</text>
  <path d="M760 690L1370 646L1388 879L724 917Z" fill="#070909" opacity="0.82"/>
  <path d="M759 690L1016 675" stroke="#ef3340" stroke-width="5"/>
  <text x="782" y="742" fill="#f7f1e9" font-family="Arial" font-size="23" font-weight="700">“We would get married all over again just so</text>
  <text x="782" y="776" fill="#f7f1e9" font-family="Arial" font-size="23" font-weight="700">we could hangout and work with Patrick. He’s a</text>
  <text x="782" y="810" fill="#f7f1e9" font-family="Arial" font-size="23" font-weight="700">talented DJ and a truly caring person.”</text>
  <text x="782" y="856" fill="#f5d71f" font-family="Arial" font-size="14" font-weight="900" letter-spacing="2">STEPHEN HENRY</text>
  <text x="64" y="952" fill="#a6b1ae" font-family="Arial" font-size="12" letter-spacing="2">AVAILABLE RESULT V4 · RESEARCH ONLY</text>
