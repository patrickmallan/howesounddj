  <text x="63" y="62" fill="#f3e9df" font-family="Arial" font-size="25" font-weight="800" letter-spacing="2">HOWE SOUND WEDDING DJ</text>
  <text x="1082" y="62" fill="#d7dfdc" font-family="Arial" font-size="16" font-weight="700">WEDDINGS · ABOUT · CONTACT</text>
