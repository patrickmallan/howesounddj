    <g stroke-width="9"><path d="M116 109h73M116 136h45M405 93h83M540 137h72M842 111h70M1132 139h72M1307 95h76M1466 126h61" stroke="#ff4f55"/><path d="M116 124h49M429 124h58M560 108h51M849 137h48M1140 113h59M1320 127h64M1471 101h53" stroke="#0754ff"/></g>
