  <g transform="translate(0 1205)">
    <rect x="35" y="0" width="1530" height="205" rx="3" fill="#171a20"/>
    <text x="65" y="39" fill="#29e0d0" font-family="Geist Mono, Menlo, monospace" font-size="18" font-weight="800" letter-spacing="4">06 / CUT-SIGNAL CUSTOM</text>
