  <text x="64" y="72" fill="#0b0d11" font-family="Geist Mono, Menlo, monospace" font-size="23" font-weight="700" letter-spacing="5">HOWE SOUND / WORDMARK TYPE AUDITION 01</text>
  <text x="1536" y="72" text-anchor="end" fill="#ff4f55" font-family="Geist Mono, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="3">FONT FIRST / NO OVERLAY CHANGES</text>

  <g transform="translate(0 105)">
    <rect x="35" y="0" width="1530" height="205" rx="3" fill="#fffaf0" stroke="#111318" stroke-width="3"/>
    <text x="65" y="39" fill="#0754ff" font-family="Geist Mono, Menlo, monospace" font-size="18" font-weight="800" letter-spacing="4">01 / AFTERHOURS GROTESK</text>
    <g fill="#101217" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="143" font-weight="900" letter-spacing="-6">
      <text x="114" y="171">H</text><text x="375" y="171">WE</text><text x="818" y="171">S</text><text x="1102" y="171">UND</text>
    </g>
