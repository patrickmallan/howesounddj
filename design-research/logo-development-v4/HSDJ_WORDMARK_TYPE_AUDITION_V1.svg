<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500">
  <defs>
    <linearGradient id="knobMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf7f0"/><stop offset=".25" stop-color="#858b91"/><stop offset=".5" stop-color="#f0ece2"/><stop offset=".78" stop-color="#5b6168"/><stop offset="1" stop-color="#dad6cc"/>
    </linearGradient>
    <radialGradient id="knobFace" cx="34%" cy="28%" r="74%">
      <stop offset="0" stop-color="#626971"/><stop offset=".3" stop-color="#24282e"/><stop offset=".77" stop-color="#090b0d"/><stop offset="1" stop-color="#020304"/>
    </radialGradient>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1" fill="#0c0e12" opacity=".08"/><circle cx="12" cy="10" r=".8" fill="#0c0e12" opacity=".06"/>
    </pattern>
    <g id="knob">
      <circle r="66" fill="#111318"/>
      <circle r="61" fill="none" stroke="#f4efe4" stroke-width="8"/>
      <circle r="53" fill="none" stroke="url(#knobMetal)" stroke-width="6"/>
      <circle r="45" fill="url(#knobFace)"/>
      <path d="M0-39V-9" stroke="#f4efe4" stroke-width="9" stroke-linecap="round"/>
      <path d="M-29-28A41 41 0 0 1 29-28" fill="none" stroke="#fff" stroke-width="3" opacity=".3"/>
      <circle r="6" fill="#020304"/>
    </g>
    <g id="wordKnobs">
      <use href="#knob" transform="translate(282 0)"/>
      <use href="#knob" transform="translate(1013 0)"/>
    </g>
  </defs>

  <rect width="1600" height="1500" fill="#f1ebdf"/>
