  <text x="800" y="1464" text-anchor="middle" fill="#60646b" font-family="Geist Mono, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="3">THE KNOBS AND SPACING ARE HELD CONSISTENT SO ONLY THE LETTER CHARACTER CHANGES.</text>
