<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="About credibility species A mobile: four speech checks lead, named proof follows, no card stack">
  <rect width="390" height="844" fill="#0c1011"/>
  <text x="22" y="43" fill="#81d9e8" font-family="Arial" font-size="12" font-weight="700" letter-spacing="2">ABOUT / THE WORK YOU DON'T SEE</text>
  <path d="M22 61H368" stroke="#47616a" stroke-width="2"/>
  <text x="20" y="119" fill="#f5f0e8" font-family="Arial" font-size="32" font-weight="800">Before someone</text>
  <text x="20" y="158" fill="#f5f0e8" font-family="Arial" font-size="32" font-weight="800">gives a speech,</text>
  <text x="20" y="197" fill="#f5f0e8" font-family="Arial" font-size="32" font-weight="800">I check four things.</text>
  <path d="M22 225H368" stroke="#f5d537" stroke-width="3"/>
  <text x="22" y="277" fill="#f5f0e8" font-family="Arial" font-size="18">The coordinator says go.</text>
  <path d="M22 294H368" stroke="#384346"/>
  <text x="22" y="337" fill="#f5f0e8" font-family="Arial" font-size="18">Photo and video are ready.</text>
  <path d="M22 354H368" stroke="#384346"/>
  <text x="22" y="397" fill="#f5f0e8" font-family="Arial" font-size="18">The wireless mic signal is good.</text>
  <path d="M22 414H368" stroke="#384346"/>
  <text x="22" y="457" fill="#f5f0e8" font-family="Arial" font-size="18">The person speaking is ready.</text>
  <text x="22" y="511" fill="#aab9b9" font-family="Arial" font-size="13">OIART graduate · wording to verify</text>
  <path d="M22 544H368" stroke="#6a7270"/>
  <text x="22" y="597" fill="#f5f0e8" font-family="Arial" font-size="22" font-style="italic">“The dance floor was</text>
  <text x="22" y="625" fill="#f5f0e8" font-family="Arial" font-size="22" font-style="italic">packed at all times!”</text>
  <text x="22" y="663" fill="#81d9e8" font-family="Arial" font-size="12" font-weight="700">CASSANDRA WILDING · REVIEW EXCERPT</text>
  <text x="22" y="818" fill="#85918e" font-family="Arial" font-size="10">STATIC STUDY A · MOBILE · NO EQUAL CARDS</text>
</svg>
