  <text x="92" y="315" fill="#f7f2e9" font-family="Arial" font-size="78" font-weight="800">Have a wedding date?</text>
  <text x="98" y="366" fill="#d8d6cf" font-family="Arial" font-size="25">Check Patrick’s calendar first. If it’s open, you can book a time to talk.</text>
  <path d="M98 419H1130" stroke="#767b77" stroke-width="2"/>
  <text x="98" y="464" fill="#b7c2bd" font-family="Arial" font-size="16" font-weight="700" letter-spacing="2">WEDDING DATE</text>
  <rect x="98" y="486" width="200" height="86" fill="#1e2322" stroke="#b7c2bd"/>
  <rect x="310" y="486" width="145" height="86" fill="#1e2322" stroke="#b7c2bd"/>
  <rect x="467" y="486" width="145" height="86" fill="#1e2322" stroke="#b7c2bd"/>
  <text x="150" y="540" fill="#faf5ed" font-family="Arial" font-size="31">YYYY</text>
  <text x="354" y="540" fill="#faf5ed" font-family="Arial" font-size="31">MM</text>
  <text x="512" y="540" fill="#faf5ed" font-family="Arial" font-size="31">DD</text>
  <rect x="98" y="606" width="514" height="88" fill="#f4d63f"/>
  <text x="164" y="661" fill="#131716" font-family="Arial" font-size="27" font-weight="800">CHECK AVAILABILITY</text>
  <text x="99" y="736" fill="#aeb5ae" font-family="Arial" font-size="18">An available date is an invitation to talk, not a confirmed booking.</text>
  <path d="M98 797H1320" stroke="#555d59"/>
  <text x="100" y="844" fill="#f7f2e9" font-family="Arial" font-size="23">No date yet? Send Patrick a message.</text>
