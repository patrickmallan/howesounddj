  <text x="21" y="287" fill="#f8f1e8" font-family="Arial" font-size="29" font-weight="800">This is the answer</text>
  <text x="21" y="323" fill="#f8f1e8" font-family="Arial" font-size="29" font-weight="800">you were hoping for.</text>
  <text x="21" y="370" fill="#f8f1e8" font-family="Arial" font-size="27" font-weight="800">Your wedding date</text>
