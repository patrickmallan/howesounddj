<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V3 Concept 2 — Human Connection (Research)</title>
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body class="concept-connection">
  <!-- NON-PRODUCTION: post-success state only; form replaced per state-replacement architecture -->
    <div
      class="panel"
      role="dialog"
      aria-label="Check wedding date availability"
      aria-labelledby="c2-heading"
    >
      <p class="sr-only" role="status">
        Availability check complete. Thursday, June 15, 2028 currently appears available.
      </p>

      <div class="panel__scroll">
        <div class="confirmed-bar">
          <span><strong>Thursday, June 15, 2028</strong> is available</span>
          <button type="button" class="change-date">Edit date</button>
        </div>

        <h1 id="c2-heading" class="headline panel__heading" tabindex="-1" style="margin-top:1rem">
          Patrick would love to hear what you&rsquo;re planning.
        </h1>
        <p class="bridge">A complimentary Sound Check is the calm next step.</p>

        <figure class="proof" aria-labelledby="c2-proof-context">
          <p id="c2-proof-context" class="proof__context">From a couple who worked with Patrick</p>
          <blockquote>
            <p class="proof__lead">
              &ldquo;We would get married all over again just so we could hangout and work with Patrick again. He&rsquo;s a talented DJ and a truly caring person.&rdquo;
            </p>
          </blockquote>
          <figcaption class="proof__attr">Stephen Henry</figcaption>
        </figure>
      </div>

      <div class="panel__footer">
        <p class="risk">45 minutes &middot; No pressure &middot; Just clarity</p>
        <a class="cta" href="#">Meet Patrick</a>
      </div>
    </div>
  </body>
</html>
