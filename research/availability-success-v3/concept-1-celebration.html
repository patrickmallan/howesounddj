<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V3 Concept 1 — Celebration (Research)</title>
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body class="concept-celebration">
  <!-- NON-PRODUCTION RESEARCH PROTOTYPE -->
    <div class="panel" role="dialog" aria-labelledby="c1-heading">
      <div class="panel__scroll">
        <div class="chip"><span class="chip__dot" aria-hidden="true"></span> Available</div>
        <h1 id="c1-heading" class="headline">Great news. Your wedding date is available.</h1>
        <p class="bridge">Thursday, June 15, 2028 is open on Patrick's calendar.</p>

        <figure class="proof" aria-labelledby="c1-proof">
          <blockquote>
            <p class="proof__lead" id="c1-proof">
              &ldquo;We would get married all over again just so we could hangout and work with Patrick again.&rdquo;
            </p>
            <p class="proof__rest">
              He&rsquo;s a talented DJ and a truly caring person.
            </p>
          </blockquote>
          <figcaption class="proof__attr">Stephen Henry</figcaption>
        </figure>
      </div>

      <div class="panel__footer">
        <p class="risk">45-minute complimentary planning session &middot; No pressure</p>
        <a class="cta" href="#">Meet Patrick</a>
        <button type="button" class="change-date">Change date</button>
      </div>
    </div>
  </body>
</html>
